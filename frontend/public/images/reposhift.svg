<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RepoShift migration workflow illustration</title>
  <desc id="desc">A dependency graph routes repository changes through an isolated test sandbox and durable checkpoint.</desc>
